<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Διαγωνισμός Νέων Ελληνικών – Α΄ & Β΄ Κλίση</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
--main:#2563eb;
--bg:#eef2ff;
--card:#ffffff;
}

body{
margin:0;
font-family:'Manrope',system-ui;
background:linear-gradient(180deg,#eef2ff,#dbeafe);
}

header{
background:linear-gradient(135deg,#1d4ed8,#3b82f6);
color:white;
text-align:center;
padding:22px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:20px;
margin:16px 0;
box-shadow:0 10px 20px rgba(0,0,0,.1);
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.choice{
border:2px solid #ddd;
border-radius:12px;
padding:12px;
margin:10px 0;
cursor:pointer;
}

.choice.correct{
background:#bbf7d0;
border-color:#16a34a;
}

.choice.wrong{
background:#fecaca;
border-color:#dc2626;
}

.hidden{display:none}

</style>
</head>

<body>

<header>
<h1>📚 Διαγωνισμός Νέων Ελληνικών</h1>
<p>Α΄ και Β΄ Κλίση Ουσιαστικών</p>
</header>

<div class="container">

<div class="card" id="start">
<label>Όνομα:</label><br>
<input id="student" placeholder="π.χ. Μαρία"><br><br>
<button onclick="startGame()">Έναρξη</button>
</div>

<div id="game" class="hidden">

<div class="card">
Πόντοι: <b id="score">0</b>
</div>

<div class="card" id="questionBox"></div>

<button id="nextBtn" class="hidden" onclick="nextQuestion()">Επόμενη</button>

</div>

<div id="end" class="card hidden"></div>

</div>


<script>

let score=0
let step=0
const qBox=document.getElementById("questionBox")

const questions=[

{q:"Γενική ενικού της λέξης «μαθήτρια»;",a:["μαθήτριες","μαθήτριας","μαθήτρια"],c:1},

{q:"Ονομαστική πληθυντικού της λέξης «χώρα»;",a:["χώρες","χώρας","χωρών"],c:0},

{q:"Αιτιατική ενικού της λέξης «γυναίκα»;",a:["γυναίκας","γυναίκα","γυναίκες"],c:1},

{q:"Γενική πληθυντικού της λέξης «πόρτα»;",a:["πόρτας","πόρτες","πορτών"],c:2},

{q:"Ονομαστική πληθυντικού της λέξης «μαθητής»;",a:["μαθητή","μαθητές","μαθητών"],c:1},

{q:"Αιτιατική πληθυντικού της λέξης «φίλος»;",a:["φίλοι","φίλων","φίλους"],c:2},

{q:"Γενική ενικού της λέξης «δρόμος»;",a:["δρόμου","δρόμος","δρόμων"],c:0},

{q:"Ονομαστική πληθυντικού της λέξης «άνθρωπος»;",a:["ανθρώπους","άνθρωποι","ανθρώπων"],c:1},

{q:"Αιτιατική ενικού της λέξης «δάσκαλος»;",a:["δάσκαλο","δάσκαλος","δασκάλου"],c:0},

{q:"Γενική πληθυντικού της λέξης «μαθητής»;",a:["μαθητές","μαθητών","μαθητή"],c:1},

{q:"Ονομαστική πληθυντικού της λέξης «βιβλίο»;",a:["βιβλίο","βιβλία","βιβλίων"],c:1},

{q:"Αιτιατική πληθυντικού της λέξης «δέντρο»;",a:["δέντρα","δέντρων","δέντρου"],c:0},

{q:"Γενική ενικού της λέξης «σπίτι»;",a:["σπίτι","σπιτιού","σπιτιών"],c:1},

{q:"Ονομαστική πληθυντικού της λέξης «παιδί»;",a:["παιδιού","παιδιά","παιδιών"],c:1},

{q:"Αιτιατική ενικού της λέξης «βιβλίο»;",a:["βιβλίο","βιβλία","βιβλίου"],c:0},

{q:"Γενική πληθυντικού της λέξης «δέντρο»;",a:["δέντρα","δέντρου","δέντρων"],c:2},

{q:"Γενική ενικού της λέξης «καρέκλα»;",a:["καρέκλα","καρέκλες","καρέκλας"],c:2},

{q:"Ονομαστική πληθυντικού της λέξης «πόρτα»;",a:["πόρτες","πορτών","πόρτας"],c:0},

{q:"Αιτιατική πληθυντικού της λέξης «γυναίκα»;",a:["γυναικών","γυναίκες","γυναίκα"],c:1},

{q:"Γενική ενικού της λέξης «χώρα»;",a:["χώρα","χώρες","χώρας"],c:2},

{q:"Ονομαστική πληθυντικού της λέξης «δάσκαλος»;",a:["δασκάλων","δάσκαλοι","δάσκαλο"],c:1},

{q:"Αιτιατική πληθυντικού της λέξης «μαθητής»;",a:["μαθητές","μαθητών","μαθητή"],c:0},

{q:"Γενική ενικού της λέξης «φίλος»;",a:["φίλων","φίλος","φίλου"],c:2},

{q:"Ονομαστική πληθυντικού της λέξης «δρόμος»;",a:["δρόμους","δρόμων","δρόμοι"],c:2},

{q:"Αιτιατική ενικού της λέξης «σπίτι»;",a:["σπιτιού","σπίτι","σπιτιών"],c:1},

{q:"Γενική πληθυντικού της λέξης «παιδί»;",a:["παιδιά","παιδιών","παιδιού"],c:1},

{q:"Ονομαστική πληθυντικού της λέξης «καρέκλα»;",a:["καρέκλες","καρέκλας","καρεκλών"],c:0},

{q:"Αιτιατική πληθυντικού της λέξης «πόρτα»;",a:["πόρτες","πορτών","πόρτα"],c:0},

{q:"Γενική ενικού της λέξης «δάσκαλος»;",a:["δάσκαλο","δασκάλου","δάσκαλοι"],c:1},

{q:"Ονομαστική πληθυντικού της λέξης «δέντρο»;",a:["δέντρων","δέντρα","δέντρου"],c:1}

]

function startGame(){
score=0
step=0
document.getElementById("score").textContent=0
document.getElementById("start").classList.add("hidden")
document.getElementById("game").classList.remove("hidden")
showQuestion()
}

function showQuestion(){

let q=questions[step]

document.getElementById("nextBtn").classList.add("hidden")

let h=`<h3>Ερώτηση ${step+1}/30</h3><p>${q.q}</p>`

q.a.forEach((opt,i)=>{
h+=`<div class='choice' onclick='check(this,${i},${q.c})'>${opt}</div>`
})

qBox.innerHTML=h
}

function check(el,i,c){

document.querySelectorAll(".choice").forEach(x=>x.onclick=null)

if(i===c){
el.classList.add("correct")
score+=5
}else{
el.classList.add("wrong")
}

document.getElementById("score").textContent=score
document.getElementById("nextBtn").classList.remove("hidden")

}

function nextQuestion(){

step++

if(step<30){
showQuestion()
}else{
endGame()
}

}

function endGame(){

document.getElementById("game").classList.add("hidden")

let end=document.getElementById("end")

end.classList.remove("hidden")

end.innerHTML=`
<h2>🎉 Τέλος Διαγωνισμού</h2>
<p>Μπράβο ${document.getElementById("student").value}!</p>
<p>Συγκέντρωσες <b>${score}</b> πόντους.</p>
`

}

</script>

</body>
</html>
